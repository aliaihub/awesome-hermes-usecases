name: Catalog consistency

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'catalog.json'
      - 'usecases/*.md'
      - 'scripts/render-catalog.py'
      - '.github/workflows/catalog-check.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'catalog.json'
      - 'usecases/*.md'
      - 'scripts/render-catalog.py'
      - '.github/workflows/catalog-check.yml'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/render-catalog.py --check
