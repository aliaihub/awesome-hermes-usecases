# Linux host-network reference setup. See README for platform limits.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    network_mode: host
    restart: unless-stopped
    environment:
      HOST: "127.0.0.1"
      PORT: "3000"
      OPENAI_API_BASE_URL: "http://127.0.0.1:8642/v1"
      OPENAI_API_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY in .env}
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      WEBUI_NAME: "Hermes"
    volumes:
      - openwebui-data:/app/backend/data
volumes:
  openwebui-data:
